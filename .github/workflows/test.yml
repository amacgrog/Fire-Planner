name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golden-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run all tests
        run: npm test

      # The Playwright UI scripts at the repo root (test_*.js), against the dist/ npm test just built.
      - name: UI scripts
        run: node tests/ui_scripts.js

      # The exact files the tests ran against, downloadable from any PR or main run. (No Pages deploy: the repository is private.)
      - uses: actions/upload-artifact@v4
        with:
          name: fire-planner-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
